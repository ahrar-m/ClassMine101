site_name: ClassMine 101
site_description: Visual High School Math & Physics Animations using Manim
site_author: ClassMine 101 Team
site_url: https://classmine101.com/

repo_url: https://github.com/ahrar-m/ClassMine101
repo_name: ahrar-m/ClassMine101

theme:
  name: material
  palette:
    # Scheme toggle for dark/light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - admonition

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Mathematics:
      - Overview: math/index.md
      - Number Systems:
          - Overview: math/number_systems/index.md
          - Real Numbers & Systems: math/number_systems/real_numbers.md
      - Algebra:
          - Overview: math/algebra/index.md
          - Polynomials & Factorisation: math/algebra/polynomials.md
          - Linear Equations: math/algebra/linear_equations.md
          - Quadratic Equations: math/algebra/quadratic_equations.md
          - Arithmetic Progression: math/algebra/arithmetic_progression.md
      - Coordinate Geometry:
          - Overview: math/coordinate_geometry/index.md
          - Cartesian Plane & Coordinates: math/coordinate_geometry/cartesian_plane.md
      - Geometry:
          - Overview: math/geometry/index.md
          - Euclid's Geometry: math/geometry/euclids_geometry.md
          - Lines and Angles: math/geometry/lines_and_angles.md
          - Triangles & Congruence: math/geometry/triangles.md
          - Quadrilaterals & Parallelograms: math/geometry/quadrilaterals.md
          - Circles: math/geometry/circles.md
          - Geometrical Constructions: math/geometry/constructions.md
      - Trigonometry:
          - Overview: math/trigonometry/index.md
          - Trigonometric Ratios & Particular Angles: math/trigonometry/trigonometric_ratios.md
          - Identities & Complementary Angles: math/trigonometry/trigonometric_identities.md
          - Heights and Distances: math/trigonometry/heights_and_distances.md
      - Mensuration:
          - Overview: math/mensuration/index.md
          - Perimeter & Area of Plane Figures: math/mensuration/plane_figures.md
          - Area of Circles, Sectors & Segments: math/mensuration/circles_sectors.md
          - Surface Area & Volume of Solids: math/mensuration/surface_area_volume.md
      - Statistics & Probability:
          - Overview: math/statistics_and_probability/index.md
          - Statistics & Data Presentation: math/statistics_and_probability/statistics.md
          - Probability: math/statistics_and_probability/probability.md
  - Physics: physics/index.md



